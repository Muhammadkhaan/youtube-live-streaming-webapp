<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Global error guard to catch and suppress any unhandled fetch getter errors
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        try {
          var _f = window.fetch;
          var defineWritableFetch = function(target) {
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() { return _f; },
                set: function(val) { _f = val; },
                configurable: true,
                enumerable: true
              });
              return true;
            } catch (err) {
              return false;
            }
          };
          if (!defineWritableFetch(window)) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              defineWritableFetch(Window.prototype);
            }
          }
        } catch (e) {}
      })();
    </script>
